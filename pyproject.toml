[project]
name = "dataesr-mcp"
version = "0.1.1"
description = "Model Context Protocol (MCP) server for interacting with dataesr resources"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.26.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "jsonschema>=4.0.0",
]

[tool.ty.environment]
python = ".venv/Scripts/python.exe"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
]

[tool.uv]
# The Docker image runs `uv sync --frozen` and `uv run`: keep test dependencies out of it.
default-groups = []

[tool.pytest.ini_options]
pythonpath = ["server"]
testpaths = ["tests"]
