[project]
name = "dataesr-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for interacting with dataesr resources"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.26.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
]

[tool.ty.environment]
python = ".venv/Scripts/python.exe"