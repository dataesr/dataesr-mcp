name: Staging deployment

on:
  push:
    branches:
      - main

env:
  DEPLOYMENT: mcp # Must match k8s deployment name
  DEPLOYMENT_NAMESPACE: mcp # Must match k8s deployment namespace
  DEPLOYMENT_URL: https://mcp.staging.dataesr.ovh/
  MM_NOTIFICATION_CHANNEL: bots

permissions:
  contents: read
  packages: write

jobs:
  publish-ghcr:
    name: 🐋 Publish Docker image
    runs-on: ubuntu-latest
    steps:
      - name: 🏁 Checkout
        uses: actions/checkout@v4

      - name: 🔑 Login ghcr.io
        run: docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: 🐋 Build docker image
        run: make build

      - name: 📦 Push docker image
        run: make push

  deploy:
    name: ✨ Update staging deployment
    runs-on: ubuntu-latest
    needs: publish-ghcr
    steps:
      - name: Deploy to Cluster
        id: kubectl-deploy
        uses: dataesr/kubectl-deploy@v1.1
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_DOAD_STAGING }}
        with:
          namespace: ${{ env.DEPLOYMENT_NAMESPACE }}
          restart: ${{ env.DEPLOYMENT }}

  notify:
    name: 📢 Mattermost notification
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: dataesr/mm-notifier-action@v1.0.3
        with:
          deployment_url: ${{ env.DEPLOYMENT_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN}}
          mattermost_channel: ${{ env.MM_NOTIFICATION_CHANNEL}}
          mattermost_webhook_url: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
